# lychee link checker configuration
# https://lychee.cli.rs/

# Verbosity level: 'error', 'warn', 'info', 'debug', 'trace'
# Setting to 'error' will hide [WARN] messages
verbose = "error"

# Resolve extensionless local links (VitePress style) by appending .md
fallback_extensions = ["md"]

# Enable anchor fragment checking for local files
include_fragments = "anchor-only"

# Exclude patterns
exclude = [
  # VitePress uses a different anchor slug algorithm from GFM for headings that
  # contain backtick spans (code) or inline links. These patterns suppress false
  # positives where the anchor is valid in VitePress but not resolvable by lychee.
  # features/index.md headings with backtick spans, e.g.
  #   ## `exec.config`, `exec.early`, `exec.late`, `exec.post`
  # VitePress slug: exec-config-exec-early-exec-late-exec-post
  # lychee/GFM slug: execconfig-execearly-execlate-execpost  (dots stripped, no hyphens)
  "file://.*reference/features#",
  # explanation/github-workflows.md has headings that are inline links, e.g.
  #   ## [nightly.yml](https://...)
  # VitePress slug: nightly-yml; lychee/GFM slug: nightlyyml
  "file://.*explanation/github-workflows#",
  # .html links are VitePress output URLs (not source files); skip existence check
  "file://.*\\.html($|#)",
  # Pages that are referenced but not yet published in this repo
  # (present in docs-ng-internal or planned for a future PR):
  "file://.*explanation/infrastructure",
  "file://.*how-to/troubleshooting",
  "file://.*releases/apt-repositories",
  "file://.*releases/major-patch-releases",
  # bare and libc feature pages are not yet documented; exclude until pages exist
  "file://.*reference/features/bare",
  "file://.*reference/features/libc\\.md",
  # VitePress dark/light mode image syntax uses #light-mode-only / #dark-mode-only
  # fragments that are not real SVG anchors; the image files themselves exist.
  "file://.*\\.svg#(light|dark)-mode-only$",
  # FIRST.org CVSS document uses client-side rendered anchors not visible to lychee
  "^https://www\\.first\\.org/cvss/specification-document#",
  # GitHub Actions workflow URLs return 503 intermittently during CI
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/\\.github/workflows/",
  # Legacy docs that reference non-existent GitHub paths
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/legacy/",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/tests/README($|#)",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/features/.*/README\\.md$",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/features/.*/file\\.include/",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/assets/",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/reference/",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/how-to/",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/tutorials/",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/contributing/",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/explanation/",
  "^https://github\\.com/gardenlinux/gardenlinux/blob/main/mailto:",
  "^https://github\\.com/gardenlinux/builder/blob/main/reference/features$",
  "^https://github\\.com/gardenlinux/gardenlinux/tree/main/tests/platformSetup/",
  "^https://github\\.com/gardenlinux/python-gardenlinux-lib/blob/main/_static/",
  "^https://github\\.com/gardenlinux/docs/blob/main/src/README\\.md$",
  "^https://github\\.com/gardenlinux/docs/blob/main/tests/README\\.md$",
  "^http://packages\\.gardenlinux\\.io/gardenlinux$",
]

# Accept these status codes as valid
accept = [200, 204, 301, 302, 429]

# Timeout per request (seconds)
timeout = 30

# Maximum number of concurrent requests
max_concurrency = 16

# Maximum number of retries per request
max_retries = 3

# Exclude private/local IPs
exclude_private = true
exclude_loopback = true

# Skip these file patterns
exclude_path = [
  "node_modules",
  "docs/.vitepress/dist",
  "docs/.vitepress/cache",
]
