name: Aggregated Repository Documentation CI

# Reusable orchestrator for documentation CI in aggregated repositories.
#
# Aggregated repositories call this workflow from a thin `.github/workflows/
# docs-check.yml` caller. All documentation-path logic and the notify/commit-lock
# decision live here, using `repos-config.json` in this repository as the single
# source of truth for "what counts as documentation".
#
# The documentation-relevant paths per repository are derived from
# `docs_path` + `root_files` (or an explicit `docs_paths` override) and written
# to a `dorny/paths-filter` configuration at runtime.

on:
  workflow_call:
    inputs:
      repo:
        description: 'Repository name as it appears in repos-config.json (e.g. gardenlinux)'
        required: true
        type: string
    secrets:
      DOCS_BOT_APP_ID:
        required: true
      DOCS_BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect docs path changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # paths-filter detects changes in pull requests via the REST API, but for
      # push events it uses git and needs the source repository checked out.
      - name: Checkout source repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Checkout docs registry
        uses: actions/checkout@v4
        with:
          repository: gardenlinux/docs
          path: .docs

      - name: Generate docs path filter from registry
        env:
          REPO: ${{ inputs.repo }}
        run: |
          python3 - <<'PY'
          import json
          import os

          repo = os.environ["REPO"]
          with open(".docs/repos-config.json", encoding="utf-8") as handle:
              config = json.load(handle)

          entry = next((r for r in config["repos"] if r["name"] == repo), None)
          if entry is None:
              raise SystemExit(f"Repository '{repo}' not found in repos-config.json")

          patterns = entry.get("docs_paths") or [
              f"{entry['docs_path']}/**",
              *entry.get("root_files", []),
          ]
          print(f"Docs path patterns for {repo}: {patterns}")

          with open(".docs-filter.yml", "w", encoding="utf-8") as handle:
              handle.write("docs:\n")
              for pattern in patterns:
                  handle.write(f"  - '{pattern}'\n")
          PY

      - name: Check for docs path changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .docs-filter.yml

  docs-checks:
    name: Docs checks
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs == 'true' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    permissions:
      contents: read
      pull-requests: read
    uses: gardenlinux/docs/.github/workflows/docs-checks.yml@main
    with:
      override-repo: ${{ inputs.repo }}
      override-ref: ${{ github.head_ref || github.ref_name }}
      override-commit: ${{ github.event.pull_request.head.sha || github.sha }}

  docs-checks-gate:
    name: Docs checks gate
    needs: [detect-changes, docs-checks]
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate docs checks result
        run: |
          DOCS_CHANGED="${{ needs.detect-changes.outputs.docs }}"
          DOCS_RESULT="${{ needs.docs-checks.result }}"
          if [[ "$DOCS_CHANGED" != "true" ]]; then
            echo "Docs paths not changed; skipping docs checks — gate passes."
            exit 0
          fi
          if [[ "$DOCS_RESULT" == "success" ]]; then
            echo "Docs checks passed."
            exit 0
          fi
          echo "Docs checks result: $DOCS_RESULT"
          exit 1

  notify-docs:
    name: Notify docs
    needs: [detect-changes, docs-checks]
    runs-on: ubuntu-24.04
    # Only notify for PR events and only when the PR actually touched docs.
    # Run after checks pass for open PRs, OR immediately for merged PRs.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.docs == 'true' &&
      (
        (github.event.action == 'closed' && github.event.pull_request.merged == true) ||
        (github.event.action != 'closed' && needs.docs-checks.result == 'success')
      )
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
          repositories: docs

      - name: Send repository dispatch to docs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const isMergedPR = context.payload.action === 'closed' &&
                               context.payload.pull_request.merged === true;

            // For merged PRs, use the base branch (the branch it was merged into)
            // For open PRs, use the head branch (feature branch)
            const ref = isMergedPR
              ? context.payload.pull_request.base.ref
              : context.payload.pull_request.head.ref;

            await github.rest.repos.createDispatchEvent({
              owner: 'gardenlinux',
              repo: 'docs',
              event_type: 'docs-pr',
              client_payload: {
                repo: '${{ inputs.repo }}',
                pr_number: `${context.payload.pull_request.number}`,
                commit_sha: isMergedPR
                  ? context.payload.pull_request.merge_commit_sha
                  : context.payload.pull_request.head.sha,
                ref: ref,
                event: isMergedPR ? 'merged' : 'pr_success'
              }
            });
            core.info('Repository dispatch sent to docs');
