name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/tests.yml'
      - '.github/workflows/tests-skip.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/tests.yml'
      - '.github/workflows/tests-skip.yml'

jobs:
  pytest:
    name: pytest (unit + integration)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pin@v7.1.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: make test
